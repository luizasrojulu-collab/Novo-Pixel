<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obrigado | NovoPixel</title>

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- SEU CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/media.css">

</head>

<body>


    <!-- CURSOR NOVOPIXEL -->
    <div id="np-cursor">
        <div class="np-core"></div>
        <div class="np-corner corner-1"></div>
        <div class="np-corner corner-2"></div>
        <div class="np-corner corner-3"></div>
        <div class="np-corner corner-4"></div>
    </div>

    <div id="np-cursor-ring"></div>


    <!-- =========================
         FUNDO ANIMADO
         ========================= -->

    <canvas id="grid"></canvas>


    <!-- =========================
         PÁGINA DE OBRIGADO
         ========================= -->

    <main class="pagina-obrigado">

        <div class="obrigado-card">

            <div class="check">
                ✓
            </div>

            <span class="tag">
                NOVOPIXEL // CONTATO
            </span>

            <h1>
                MENSAGEM ENVIADA!
            </h1>

            <p>
                Recebemos sua mensagem com sucesso.
                Obrigado por entrar em contato com a NovoPixel.
                Nossa equipe entrará em contato com você em breve.
            </p>

            <a href="index.html" class="voltar">
                ← VOLTAR PARA O SITE
            </a>

        </div>

    </main>


    <!-- SEU JAVASCRIPT -->
    <script src="./assets/js/script.js"></script>

</body>

</html>
